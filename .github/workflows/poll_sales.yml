name: poll_sales

permissions:
  contents: write
  issues: write

on:
  schedule:
    - cron: '0 * * * *'   # hourly UTC
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get sales since last
        env:
          GUMROAD_TOKEN: ${{ secrets.GUMROAD_TOKEN }}
        run: |
          set -e
          mkdir -p data/sales
          ts=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          # Gumroad after= 要 YYYY-MM-DD 格式
          last_date=""
          [[ -f data/sales/.last_date ]] && last_date=$(cat data/sales/.last_date)

          if [[ -n "$last_date" ]]; then
            url="https://api.gumroad.com/v2/sales?after=${last_date}"
          else
            url="https://api.gumroad.com/v2/sales"
          fi
          resp=$(curl -sS -H "Authorization: Bearer $GUMROAD_TOKEN" "$url" || echo '{"success":false}')

          # Save raw response
          fn=$(date -u '+%Y%m%d_%H%M%S').json
          echo "$resp" > "data/sales/$fn"
          # 寫今日日期(YYYY-MM-DD)供下次 after= 用
          date -u '+%Y-%m-%d' > data/sales/.last_date
          echo "$ts" > data/sales/.last_ts

          new_count=$(echo "$resp" | jq '.sales | length // 0' 2>/dev/null || echo 0)
          echo "new_sales: $new_count"

          if (( new_count > 0 )); then
            # Append income_events.log line per sale
            mkdir -p data/income
            echo "$resp" | jq -r '.sales[] | [(now|tostring), "USD", (.price/100|tostring), (.price/100|tostring), "gumroad", "false"] | @tsv' >> data/income/income_events.log

            # Open issue
            body=$(echo "$resp" | jq -r '.sales[] | "- " + .product_name + " — $" + (.price/100|tostring)' | head -10)
            gh_token="${{ secrets.GITHUB_TOKEN }}"
            curl -sS -X POST -H "Authorization: token $gh_token" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/issues" \
              -d "$(jq -n --arg title "🔔 New Gumroad sale ($new_count)" --arg body "$body" '{title:$title, body:$body, labels:["income","gumroad"]}')"
          fi

      - name: Commit data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "auto: poll_sales $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          git push
